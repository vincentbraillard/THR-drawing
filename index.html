<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Éditeur de Tracés Sunae</title>
    <style>
        :root { --primary: #0078D7; --bg: #f3f3f3; --panel: #ffffff; --border: #ddd; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; position: fixed; overflow: hidden; background: var(--bg); touch-action: none; }
        body { display: flex; flex-direction: column; }
        
        #top-area { display: flex; flex: 1; overflow: hidden; position: relative; }
        #canvas-wrapper { flex: 1; position: relative; overflow: hidden; background: #e5e5e5; cursor: crosshair; touch-action: none; }
        canvas { position: absolute; top: 0; left: 0; }
        
        #toggle-sidebar-btn { position: absolute; top: 15px; right: 15px; z-index: 100; padding: 10px 15px; background: white; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        #right-panel { width: 340px; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid var(--border); z-index: 10; transition: width 0.2s; }
        #undo-redo-bar { display: flex; padding: 10px; border-bottom: 1px solid var(--border); gap: 10px; background: #fafafa; }
        #undo-redo-bar button { flex: 1; padding: 8px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
        #undo-redo-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .tabs { display: flex; background: #eee; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: none; font-size: 13px; cursor: pointer; font-weight: 500; }
        .tab-btn.active { background: white; border-bottom: 2px solid var(--primary); font-weight: bold; color: var(--primary); }
        .tab-content { display: none; padding: 15px; flex: 1; overflow-y: auto; }
        .tab-content.active { display: block; }
        
        fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        legend { font-weight: bold; color: #333; padding: 0 5px; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .row-slider { display: flex; align-items: center; gap: 5px; margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 500; }
        .val-badge { font-weight: bold; font-size: 13px; color: var(--primary); }
        
        input[type="range"] { flex: 1; }
        button.btn { background: #f0f0f0; border: 1px solid #ccc; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500;}
        button.btn-primary { background: var(--primary); color: white; border: none; }
        button.btn-export { background: #2e7d32; color: white; font-weight: bold; padding: 12px; border-radius: 6px; width: 100%; font-size: 14px; border:none; margin-top: 10px;}
        button.btn-icon { padding: 4px 8px; font-size: 12px; }
        
        #layer-list { list-style: none; padding: 0; margin: 0; border: 1px solid var(--border); border-radius: 4px; max-height: 250px; overflow-y: auto; background: white; }
        .layer-item { padding: 6px 8px; border-bottom: 1px solid #eee; display: flex; align-items: center; font-size: 13px; transition: background 0.2s; }
        .layer-item.selected { background: #e3f2fd; }
        .layer-item.locked { color: #888; }
        .layer-icon { width: 14px; height: 14px; display: inline-block; margin-right: 8px; border: 1px solid #999; border-radius: 3px; flex-shrink: 0;}
        .rename-btn { cursor: pointer; color: #666; font-size: 11px; padding: 2px 5px; background: #eee; border-radius: 4px; margin-left: 5px; }
        
        /* Styles pour le Drag and Drop */
        .drag-over-folder { box-shadow: inset 0 0 0 2px var(--primary); background: #e3f2fd !important; }
        .drag-over-layer { border-top: 3px solid var(--primary) !important; }
        
        #bottom-panel { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel); padding: 10px 20px 20px 20px; z-index: 10; display:flex; flex-direction: column; position: relative;}
    </style>
</head>
<body>

    <div id="top-area">
        <div id="canvas-wrapper">
            <canvas id="canvas"></canvas>
            <button id="toggle-sidebar-btn" onclick="app.toggleSidebar()">▶ Cacher</button>
        </div>

        <div id="right-panel">
            <div id="undo-redo-bar">
                <button id="btn-undo" onclick="app.undo()" disabled>↩️ Undo</button>
                <button id="btn-redo" onclick="app.redo()" disabled>↪️ Redo</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="app.openTab(event, 'tab-file')">📁 Fichier</button>
                <button class="tab-btn" onclick="app.openTab(event, 'tab-tools')">🖌️ Outils</button>
                <button class="tab-btn" onclick="app.openTab(event, 'tab-image')">🖼️ Image</button>
                <button class="tab-btn" onclick="app.openTab(event, 'tab-layers')">📑 Calques</button>
            </div>

            <div id="tab-file" class="tab-content active">
                <fieldset>
                    <legend>💾 Projet (.sunae)</legend>
                    <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                        <input type="file" id="file-open" accept=".sunae" style="display: none;" onchange="app.loadProject(event)">
                        <button class="btn" style="flex:1" onclick="document.getElementById('file-open').click()">📂 Ouvrir</button>
                    </div>
                    <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                        <button class="btn" style="flex:1" onclick="app.saveProject(false)">💾 Enregistrer</button>
                        <button class="btn" style="flex:1" onclick="app.saveProject(true)">📝 Sous...</button>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>🖥️ Espace de travail</legend>
                    <div class="row"><label>🔍 Zoom du Canevas :</label> <span class="val-badge" id="val-zoom">100%</span></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('zoom-workspace', -10)">➖</button>
                        <input type="range" id="zoom-workspace" min="10" max="1000" value="100" oninput="app.updateZoomFromSlider()">
                        <button class="btn btn-icon" onclick="app.stepSlider('zoom-workspace', 10)">➕</button>
                    </div>
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: normal;">
                        <input type="checkbox" id="chk-sim-points" checked onchange="app.draw()"> 🟢/🔴 Points début/fin
                    </label>
                </fieldset>
                <button class="btn-export" onclick="app.exportTHR()">📤 Exporter en .thr</button>
            </div>

            <div id="tab-tools" class="tab-content">
                <fieldset>
                    <legend>🛠️ Outils Actifs</legend>
                    <label style="display:flex; margin-bottom:8px;"><input type="radio" name="tool" value="pen" checked onchange="app.changeTool()"> ✏️ Crayon (Dessin)</label>
                    <label style="display:flex; margin-bottom:8px;"><input type="radio" name="tool" value="wall" onchange="app.changeTool()"> 🧱 Mur (Exclusion)</label>
                    <label style="display:flex; margin-bottom:15px;"><input type="radio" name="tool" value="select" onchange="app.changeTool()"> 🖐️ Sélection/Déplacement</label>
                    
                    <div style="position: relative; width: 100%;">
                        <input type="color" id="color-picker" value="#000000" style="position: absolute; top:0; left:0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2;" onchange="app.changeColor()" oninput="app.changeColor()">
                        <button class="btn btn-primary" id="btn-color" style="width:100%; background:black; pointer-events: none; z-index: 1; position: relative;">🎨 Couleur du trait</button>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>🖌️ Paramètres du pinceau</legend>
                    <div class="row"><label>📏 Épaisseur du trait :</label> <span class="val-badge" id="val-width">2.0</span></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('slider-width', -1)">➖</button>
                        <input type="range" id="slider-width" min="10" max="100" value="20" oninput="app.updateSliders()">
                        <button class="btn btn-icon" onclick="app.stepSlider('slider-width', 1)">➕</button>
                    </div>
                    <div class="row"><label>🫨 Lissage Anti-tremblement :</label> <span class="val-badge" id="val-tremor">0</span></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('slider-tremor', -1)">➖</button>
                        <input type="range" id="slider-tremor" min="0" max="100" value="0" oninput="app.updateSliders()">
                        <button class="btn btn-icon" onclick="app.stepSlider('slider-tremor', 1)">➕</button>
                    </div>
                    <div class="row"><label>〰️ Lissage (Corde) :</label> <span class="val-badge" id="val-rope">5.0</span></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('slider-rope', -1)">➖</button>
                        <input type="range" id="slider-rope" min="0" max="100" value="10" oninput="app.updateSliders()">
                        <button class="btn btn-icon" onclick="app.stepSlider('slider-rope', 1)">➕</button>
                    </div>
                </fieldset>
            </div>

            <div id="tab-image" class="tab-content">
                <input type="file" id="file-image" accept="image/png, image/jpeg" style="display:none;" onchange="app.importImage(event)">
                <button class="btn" style="width:100%; padding:10px; margin-bottom:15px; font-weight:bold;" onclick="document.getElementById('file-image').click()">📂 Importer Image</button>
                <fieldset id="fs-image" disabled>
                    <legend>🖼️ Calque Image Sélectionné</legend>
                    <div class="row"><label>🌗 Opacité :</label></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('img-opacity', -5)">➖</button>
                        <input type="range" id="img-opacity" min="0" max="100" value="50" oninput="app.updateImageTransform()">
                        <button class="btn btn-icon" onclick="app.stepSlider('img-opacity', 5)">➕</button>
                    </div>
                    <div class="row"><label>📐 Échelle :</label></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('img-scale', -5)">➖</button>
                        <input type="range" id="img-scale" min="10" max="1000" value="100" oninput="app.updateImageTransform()">
                        <button class="btn btn-icon" onclick="app.stepSlider('img-scale', 5)">➕</button>
                    </div>
                    <div class="row"><label>🔄 Rotation :</label> <span class="val-badge" id="val-rot">0°</span></div>
                    <div class="row-slider">
                        <button class="btn btn-icon" onclick="app.stepSlider('img-rot', -1)">➖</button>
                        <input type="range" id="img-rot" min="-180" max="180" value="0" oninput="app.updateImageTransform()">
                        <button class="btn btn-icon" onclick="app.stepSlider('img-rot', 1)">➕</button>
                    </div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="btn" style="flex:1" onclick="app.toggleFlip('H')">↔️ Miroir H</button>
                        <button class="btn" style="flex:1" onclick="app.toggleFlip('V')">↕️ Miroir V</button>
                    </div>
                </fieldset>
            </div>

            <div id="tab-layers" class="tab-content">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label>Organisation :</label>
                    <label style="background: #e3f2fd; padding: 3px 8px; border-radius: 12px; font-size:12px;">
                        <input type="checkbox" id="multi-select-mode" onchange="app.refreshLayerList()"> Choix multiple
                    </label>
                </div>
                
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button class="btn" title="Monter" onclick="app.moveLayer(-1)">⬆️</button>
                    <button class="btn" title="Descendre" onclick="app.moveLayer(1)">⬇️</button>
                    <button class="btn" style="flex:1" onclick="app.groupSelected()">📁 Grouper</button>
                    <button class="btn" style="flex:1" onclick="app.ungroupSelected()">📂 Sortir</button>
                </div>

                <div style="font-size: 11px; color: #666; margin-bottom: 5px; text-align: center;">Maintien long pour glisser-déposer (Drag&Drop)</div>
                <ul id="layer-list"></ul>
                
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="btn" id="btn-lock" style="flex:1" onclick="app.toggleLock()">🔒 Verrouiller</button>
                    <button class="btn" id="btn-merge" style="flex:1; background:#e8f5e9; color:#2e7d32;" onclick="app.mergeSelected()">🔗 Fusionner</button>
                    <button class="btn" id="btn-delete" style="flex:1; background:#ffebee; color:#c62828;" onclick="app.deleteSelected()">🗑️ Suppr.</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ZONE SIMULATEUR -->
    <div id="bottom-panel">
        <div class="row">
            <label>▶️ Simulateur de tracé (Bille) :</label>
            <span class="val-badge" id="val-sim">0.0%</span>
        </div>
        <div class="row-slider" style="margin-bottom: 0;">
            <button class="btn btn-icon" onclick="app.stepSlider('slider-sim', -10)">➖</button>
            <input type="range" id="slider-sim" min="0" max="1000" value="0" style="height:20px;" oninput="app.updateSim()">
            <button class="btn btn-icon" onclick="app.stepSlider('slider-sim', 10)">➕</button>
        </div>
        <span style="position: absolute; right: 15px; bottom: 8px; font-size: 12px; color: #999; font-weight: bold;">v1.3</span>
    </div>

<script>
const app = {
    canvas: document.getElementById('canvas'),
    ctx: document.getElementById('canvas').getContext('2d'),
    TABLE_RADIUS: 300,
    
    layers: [], 
    undoStack: [], redoStack: [],
    layerCount: 1, imgCount: 1, wallCount: 1, folderCount: 1,
    selectedIds: [], 
    currentFileName: null,
    draggedId: null, // Gestion du Drag & Drop
    
    ui: {
        tool: 'pen', penWidth: 2.0, ropeLength: 5.0, tremor: 0.0, color: '#000000',
        zoom: 1.0, panX: 0, panY: 0, simPercent: 0, isDrawing: false, isPanning: false, isDraggingImage: false
    },
    
    pos: { startPan: {x:0, y:0}, startImgDrag: {x:0, y:0, initX:0, initY:0}, anchor: {x:0, y:0}, lastSmoothed: {x:0, y:0}, currentPath: [] },

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupEvents();
        this.draw();
    },

    resize() {
        const wrapper = document.getElementById('canvas-wrapper');
        const rect = wrapper.getBoundingClientRect();
        this.canvas.width = rect.width * window.devicePixelRatio;
        this.canvas.height = rect.height * window.devicePixelRatio;
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
        this.vw = rect.width; this.vh = rect.height;
        this.draw();
    },

    getScenePos(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        let x = clientX - rect.left;
        let y = clientY - rect.top;
        return {
            x: (x - this.vw/2 - this.ui.panX) / this.ui.zoom,
            y: (y - this.vh/2 - this.ui.panY) / this.ui.zoom
        };
    },

    setupEvents() {
        const wrapper = document.getElementById('canvas-wrapper');
        let activePointers = new Map();
        let initialPinchDistance = null;
        let initialPinchZoom = 1.0;
        let initialPinchCenter = null;

        wrapper.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            activePointers.set(e.pointerId, e);

            // GESTION 2 DOIGTS (PAN & ZOOM UNIVERSEL)
            if (activePointers.size === 2) {
                this.ui.isDrawing = false;
                this.ui.isPanning = false;
                this.ui.isDraggingImage = false;
                this.pos.currentPath = [];
                
                let pts = Array.from(activePointers.values());
                let dx = pts[0].clientX - pts[1].clientX;
                let dy = pts[0].clientY - pts[1].clientY;
                initialPinchDistance = Math.hypot(dx, dy);
                initialPinchZoom = this.ui.zoom;
                initialPinchCenter = { x: (pts[0].clientX + pts[1].clientX) / 2, y: (pts[0].clientY + pts[1].clientY) / 2 };
                return;
            }

            if (e.button === 2 || this.ui.tool === 'select') {
                let selInfo = this.selectedIds.length === 1 ? this.findLayer(this.selectedIds[0]) : null;
                let sel = selInfo ? selInfo.layer : null;
                
                if (e.button !== 2 && this.ui.tool === 'select' && sel && sel.type === 'image' && !sel.effectiveLocked) {
                    this.ui.isDraggingImage = true;
                    this.pos.startImgDrag = { x: e.clientX, y: e.clientY, initX: sel.x, initY: sel.y };
                    wrapper.style.cursor = 'move';
                } else {
                    this.ui.isPanning = true;
                    this.pos.startPan = { x: e.clientX - this.ui.panX, y: e.clientY - this.ui.panY };
                    wrapper.style.cursor = 'grabbing';
                }
                return;
            }

            if (activePointers.size === 1 && (this.ui.tool === 'pen' || this.ui.tool === 'wall')) {
                const pt = this.getScenePos(e.clientX, e.clientY);
                if (Math.hypot(pt.x, pt.y) <= this.TABLE_RADIUS) {
                    this.ui.isDrawing = true;
                    this.pos.anchor = {x: pt.x, y: pt.y};
                    this.pos.lastSmoothed = {x: pt.x, y: pt.y};
                    this.pos.currentPath = [{...this.pos.anchor}];
                    this.draw();
                }
            }
        });

        wrapper.addEventListener('pointermove', (e) => {
            e.preventDefault();
            if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, e);

            // GESTION 2 DOIGTS CONTINU (PAN & ZOOM)
            if (activePointers.size === 2) {
                if (initialPinchDistance && initialPinchCenter) {
                    let pts = Array.from(activePointers.values());
                    let cx = (pts[0].clientX + pts[1].clientX) / 2;
                    let cy = (pts[0].clientY + pts[1].clientY) / 2;
                    let dx = pts[0].clientX - pts[1].clientX;
                    let dy = pts[0].clientY - pts[1].clientY;
                    let dist = Math.hypot(dx, dy);
                    
                    let scale = dist / initialPinchDistance;
                    this.ui.zoom = Math.max(0.1, Math.min(10.0, initialPinchZoom * scale));
                    document.getElementById('zoom-workspace').value = this.ui.zoom * 100;
                    document.getElementById('val-zoom').innerText = Math.round(this.ui.zoom * 100) + "%";
                    
                    let panDx = cx - initialPinchCenter.x;
                    let panDy = cy - initialPinchCenter.y;
                    this.ui.panX += panDx;
                    this.ui.panY += panDy;
                    initialPinchCenter = {x: cx, y: cy}; 

                    this.draw();
                }
                return;
            }

            if (this.ui.isDraggingImage) {
                let sel = this.findLayer(this.selectedIds[0]).layer;
                if (sel) {
                    let dx = (e.clientX - this.pos.startImgDrag.x) / this.ui.zoom;
                    let dy = (e.clientY - this.pos.startImgDrag.y) / this.ui.zoom;
                    sel.x = this.pos.startImgDrag.initX + dx;
                    sel.y = this.pos.startImgDrag.initY + dy;
                    this.draw();
                }
                return;
            }

            if (this.ui.isPanning) {
                this.ui.panX = e.clientX - this.pos.startPan.x;
                this.ui.panY = e.clientY - this.pos.startPan.y;
                this.draw();
                return;
            }

            if (this.ui.isDrawing) {
                const pt = this.getScenePos(e.clientX, e.clientY);
                if (this.ui.tool === 'pen') {
                    let alpha = this.ui.tremor > 0 ? 1.0 - (this.ui.tremor / 105.0) : 1.0;
                    let sx = this.pos.lastSmoothed.x + alpha * (pt.x - this.pos.lastSmoothed.x);
                    let sy = this.pos.lastSmoothed.y + alpha * (pt.y - this.pos.lastSmoothed.y);
                    this.pos.lastSmoothed = {x: sx, y: sy};
                    
                    let dx = sx - this.pos.anchor.x;
                    let dy = sy - this.pos.anchor.y;
                    let d = Math.hypot(dx, dy);
                    
                    if (d > this.ui.ropeLength) {
                        let angle = Math.atan2(dy, dx);
                        let nx = sx - Math.cos(angle) * this.ui.ropeLength;
                        let ny = sy - Math.sin(angle) * this.ui.ropeLength;
                        
                        let r = Math.hypot(nx, ny);
                        if (r > this.TABLE_RADIUS) {
                            nx = (nx / r) * this.TABLE_RADIUS;
                            ny = (ny / r) * this.TABLE_RADIUS;
                        }
                        
                        let testPos = {x: nx, y: ny};
                        let inWall = false;
                        let flat = this.getFlatLayers();
                        for (let l of flat) {
                            if (l.effectiveVisible && l.type === 'wall' && this.pointInPolygon(testPos, l.points)) {
                                inWall = true; break;
                            }
                        }
                        if (!inWall) {
                            this.pos.anchor = testPos;
                            this.pos.currentPath.push({...this.pos.anchor});
                        }
                    }
                } else if (this.ui.tool === 'wall') {
                    this.pos.currentPath.push(pt);
                }
                this.draw();
            }
        });

        const endAction = (e) => {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) {
                initialPinchDistance = null;
                initialPinchCenter = null;
            }

            if (this.ui.isDraggingImage) {
                this.ui.isDraggingImage = false;
                wrapper.style.cursor = 'pointer';
                this.saveState(); 
            }

            if (this.ui.isPanning) {
                this.ui.isPanning = false;
                wrapper.style.cursor = this.ui.tool === 'select' ? 'pointer' : 'crosshair';
            }
            
            if (this.ui.isDrawing) {
                this.ui.isDrawing = false;
                if (this.pos.currentPath.length > 1) {
                    if (this.ui.tool === 'wall') this.pos.currentPath.push({...this.pos.currentPath[0]});
                    this.addLayer({ type: this.ui.tool, color: this.ui.color, width: this.ui.penWidth, points: [...this.pos.currentPath] });
                }
                this.pos.currentPath = [];
                this.draw();
            }
        };

        wrapper.addEventListener('pointerup', endAction);
        wrapper.addEventListener('pointercancel', endAction);
        wrapper.addEventListener('pointerleave', endAction);
        
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            this.stepSlider('zoom-workspace', e.deltaY > 0 ? -10 : 10);
        });
        wrapper.addEventListener('contextmenu', e => e.preventDefault());
    },

    pointInPolygon(point, vs) {
        let x = point.x, y = point.y, inside = false;
        for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
            let xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
            let intersect = ((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    },

    getFlatLayers(arr = this.layers, parentVisible = true, parentLocked = false) {
        let res = [];
        for (let l of arr) {
            l.effectiveVisible = parentVisible && l.visible;
            l.effectiveLocked = parentLocked || l.locked;
            if (l.type === 'folder') {
                res.push(...this.getFlatLayers(l.layers, l.effectiveVisible, l.effectiveLocked));
            } else {
                res.push(l);
            }
        }
        return res;
    },

    findLayer(id, arr = this.layers) {
        for (let i = 0; i < arr.length; i++) {
            if (arr[i].id == id) return { layer: arr[i], parentArr: arr, idx: i };
            if (arr[i].type === 'folder') {
                let res = this.findLayer(id, arr[i].layers);
                if (res) return res;
            }
        }
        return null;
    },

    draw() {
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        let pr = window.devicePixelRatio;
        this.ctx.translate(this.vw/2 * pr, this.vh/2 * pr);
        this.ctx.translate(this.ui.panX * pr, this.ui.panY * pr);
        this.ctx.scale(this.ui.zoom * pr, this.ui.zoom * pr);

        this.ctx.beginPath();
        this.ctx.arc(0, 0, this.TABLE_RADIUS, 0, Math.PI*2);
        this.ctx.fillStyle = "#ffffff"; this.ctx.fill();
        this.ctx.lineWidth = 2; this.ctx.strokeStyle = "#000000"; this.ctx.stroke();

        let flatLayers = this.getFlatLayers();
        
        for (let i = flatLayers.length - 1; i >= 0; i--) {
            let l = flatLayers[i];
            if (!l.effectiveVisible) continue;
            
            if (l.type === 'image' && l.img) {
                this.ctx.save();
                this.ctx.translate(l.x, l.y);
                this.ctx.rotate(l.rot * Math.PI / 180);
                this.ctx.scale(l.scale * (l.flipH ? -1 : 1), l.scale * (l.flipV ? -1 : 1));
                this.ctx.globalAlpha = l.opacity;
                this.ctx.drawImage(l.img, -l.img.width/2, -l.img.height/2);
                this.ctx.restore();
            } else if (l.points && l.points.length > 1) {
                this.ctx.beginPath();
                this.ctx.moveTo(l.points[0].x, l.points[0].y);
                for(let j=1; j<l.points.length; j++) this.ctx.lineTo(l.points[j].x, l.points[j].y);
                
                if (l.type === 'wall') {
                    this.ctx.fillStyle = "rgba(255, 0, 0, 0.2)"; this.ctx.fill();
                    this.ctx.strokeStyle = "red"; this.ctx.lineWidth = 2;
                    this.ctx.setLineDash([5, 5]); this.ctx.stroke(); this.ctx.setLineDash([]);
                } else {
                    this.ctx.strokeStyle = l.color; this.ctx.lineWidth = l.width;
                    this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round'; this.ctx.stroke();
                }
            }
        }

        if (this.ui.isDrawing && this.pos.currentPath.length > 0) {
            this.ctx.beginPath();
            this.ctx.moveTo(this.pos.currentPath[0].x, this.pos.currentPath[0].y);
            for(let j=1; j<this.pos.currentPath.length; j++) this.ctx.lineTo(this.pos.currentPath[j].x, this.pos.currentPath[j].y);
            
            if (this.ui.tool === 'wall') {
                this.ctx.strokeStyle = "red"; this.ctx.lineWidth = 2; this.ctx.setLineDash([5,5]); this.ctx.stroke(); this.ctx.setLineDash([]);
            } else {
                this.ctx.strokeStyle = this.ui.color; this.ctx.lineWidth = this.ui.penWidth;
                this.ctx.lineCap = 'round'; this.ctx.lineJoin = 'round'; this.ctx.stroke();
                
                if (this.ui.ropeLength > 0) {
                    this.ctx.beginPath(); this.ctx.moveTo(this.pos.lastSmoothed.x, this.pos.lastSmoothed.y); this.ctx.lineTo(this.pos.anchor.x, this.pos.anchor.y);
                    this.ctx.strokeStyle = "red"; this.ctx.lineWidth = 1.5 / this.ui.zoom; this.ctx.setLineDash([4,4]); this.ctx.stroke(); this.ctx.setLineDash([]);
                }
            }
        }

        this.drawSimulation(flatLayers);
    },

    drawSimulation(flatLayers) {
        let pts = [];
        for (let i = flatLayers.length - 1; i >= 0; i--) {
            let l = flatLayers[i];
            if (l.effectiveVisible && (l.type === 'path' || l.type === 'pen') && l.points) {
                for(let j = 0; j < l.points.length; j++) pts.push(l.points[j]);
            }
        }
        
        if (pts.length === 0) return;

        let dists = [0], totalDist = 0;
        for (let i = 1; i < pts.length; i++) {
            totalDist += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
            dists.push(totalDist);
        }

        let targetDist = (this.ui.simPercent / 1000.0) * totalDist;
        let ballPos = pts[0];
        
        if (this.ui.simPercent > 0 && totalDist > 0) {
            this.ctx.beginPath(); 
            this.ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                if (dists[i] <= targetDist) {
                    this.ctx.lineTo(pts[i].x, pts[i].y);
                    ballPos = pts[i];
                } else {
                    let segLen = dists[i] - dists[i-1];
                    let ratio = segLen > 0 ? (targetDist - dists[i-1]) / segLen : 0;
                    let nx = pts[i-1].x + (pts[i].x - pts[i-1].x) * ratio;
                    let ny = pts[i-1].y + (pts[i].y - pts[i-1].y) * ratio;
                    this.ctx.lineTo(nx, ny);
                    ballPos = { x: nx, y: ny };
                    break;
                }
            }
            this.ctx.strokeStyle = "rgba(0, 120, 215, 0.8)"; this.ctx.lineWidth = 3 / this.ui.zoom; this.ctx.stroke();
        }

        let pointRadius = 6 / this.ui.zoom;
        let ballRadius = 7 / this.ui.zoom;

        if (document.getElementById('chk-sim-points').checked) {
            this.ctx.beginPath(); this.ctx.arc(pts[0].x, pts[0].y, pointRadius, 0, Math.PI*2); 
            this.ctx.fillStyle = "green"; this.ctx.fill(); 
            
            this.ctx.beginPath(); this.ctx.arc(pts[pts.length-1].x, pts[pts.length-1].y, pointRadius, 0, Math.PI*2); 
            this.ctx.fillStyle = "red"; this.ctx.fill(); 
        }

        this.ctx.beginPath(); this.ctx.arc(ballPos.x, ballPos.y, ballRadius, 0, Math.PI*2);
        this.ctx.fillStyle = "#ccc"; this.ctx.fill(); this.ctx.strokeStyle="#000"; this.ctx.lineWidth=1/this.ui.zoom; this.ctx.stroke();
    },

    // --- UI ---
    openTab(evt, tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');
    },
    
    toggleSidebar() {
        const panel = document.getElementById('right-panel');
        const btn = document.getElementById('toggle-sidebar-btn');
        if (panel.style.display === 'none') {
            panel.style.display = 'flex';
            btn.innerText = '▶ Cacher';
        } else {
            panel.style.display = 'none';
            btn.innerText = '◀ Afficher';
        }
        setTimeout(() => this.resize(), 50); 
    },

    stepSlider(id, step) {
        const el = document.getElementById(id);
        let val = parseFloat(el.value) + step;
        if(val < el.min) val = el.min;
        if(val > el.max) val = el.max;
        el.value = val;
        el.dispatchEvent(new Event('input')); 
    },

    updateZoomFromSlider() {
        let val = document.getElementById('zoom-workspace').value;
        document.getElementById('val-zoom').innerText = val + "%";
        this.ui.zoom = val / 100.0;
        this.draw();
    },

    changeTool() {
        this.ui.tool = document.querySelector('input[name="tool"]:checked').value;
        document.getElementById('canvas-wrapper').style.cursor = this.ui.tool === 'select' ? 'pointer' : 'crosshair';
    },

    changeColor() {
        this.ui.color = document.getElementById('color-picker').value;
        const btn = document.getElementById('btn-color');
        btn.style.backgroundColor = this.ui.color;
        const hex = this.ui.color.replace('#', '');
        const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
        btn.style.color = ((r*299 + g*587 + b*114) / 1000) > 128 ? 'black' : 'white';
    },

    updateSliders() {
        this.ui.penWidth = document.getElementById('slider-width').value / 10.0;
        document.getElementById('val-width').innerText = this.ui.penWidth.toFixed(1);
        this.ui.tremor = document.getElementById('slider-tremor').value;
        document.getElementById('val-tremor').innerText = this.ui.tremor;
        this.ui.ropeLength = document.getElementById('slider-rope').value / 2.0;
        document.getElementById('val-rope').innerText = this.ui.ropeLength.toFixed(1);
    },

    updateSim() {
        this.ui.simPercent = parseInt(document.getElementById('slider-sim').value);
        document.getElementById('val-sim').innerText = (this.ui.simPercent / 10.0).toFixed(1) + "%";
        this.draw();
    },

    // --- GESTION CALQUES, DOSSIERS ET DRAG & DROP ---
    onDragStart(e, id) {
        this.draggedId = id;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => e.target.style.opacity = '0.4', 0);
    },

    onDragOver(e, type) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        let li = e.currentTarget;
        if (type === 'folder') {
            li.classList.add('drag-over-folder');
            li.classList.remove('drag-over-layer');
        } else {
            li.classList.add('drag-over-layer');
            li.classList.remove('drag-over-folder');
        }
    },

    onDragLeave(e) {
        e.currentTarget.classList.remove('drag-over-folder');
        e.currentTarget.classList.remove('drag-over-layer');
    },

    onDrop(e, targetId) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over-folder');
        e.currentTarget.classList.remove('drag-over-layer');
        e.currentTarget.style.opacity = '1';

        if (!this.draggedId || this.draggedId == targetId) return;

        let draggedInfo = this.findLayer(this.draggedId);
        let targetInfo = this.findLayer(targetId);
        
        if (!draggedInfo || !targetInfo) return;

        if (draggedInfo.layer.type === 'folder') {
            let isChild = this.findLayer(targetId, draggedInfo.layer.layers);
            if (isChild) return alert("Impossible de déplacer un dossier dans lui-même.");
        }

        this.saveState();
        let draggedLayer = draggedInfo.parentArr.splice(draggedInfo.idx, 1)[0];
        targetInfo = this.findLayer(targetId); // Re-find in case indices shifted

        if (targetInfo.layer.type === 'folder') {
            targetInfo.layer.layers.unshift(draggedLayer);
            targetInfo.layer.isOpen = true;
        } else {
            targetInfo.parentArr.splice(targetInfo.idx, 0, draggedLayer);
        }

        this.draggedId = null;
        this.selectedIds = [draggedLayer.id];
        this.refreshLayerList();
    },

    onDragEnd(e) {
        e.target.style.opacity = '1';
        this.draggedId = null;
    },

    renderTree(arr, depth) {
        let html = '';
        arr.forEach(l => {
            let isSel = this.selectedIds.includes(l.id);
            let pad = depth * 20 + 8;
            let col = l.type === 'wall' ? 'red' : l.type === 'image' ? '#ccc' : (l.type === 'folder' ? '#ffd700' : l.color);
            
            let icon = '';
            if (l.type === 'folder') {
                icon = `<span onclick="app.toggleFolder(${l.id}, event)" style="cursor:pointer; margin-right:5px; width:12px; display:inline-block; font-size:10px;">${l.isOpen ? '▼' : '▶'}</span>`;
            }

            html += `<li class="layer-item ${isSel ? 'selected' : ''} ${l.locked ? 'locked' : ''}" style="padding-left: ${pad}px" 
                draggable="true" 
                ondragstart="app.onDragStart(event, ${l.id})" 
                ondragover="app.onDragOver(event, '${l.type}')" 
                ondragleave="app.onDragLeave(event)" 
                ondrop="app.onDrop(event, ${l.id})" 
                ondragend="app.onDragEnd(event)">
                
                <input type="checkbox" style="margin-right:8px;" ${l.visible ? 'checked' : ''} onchange="app.toggleVis('${l.id}')">
                ${icon}
                <span class="layer-icon" style="background-color: ${col}"></span>
                <span style="flex:1; cursor:pointer;" onclick="app.selectLayer('${l.id}')">${l.name} ${l.locked ? '🔒' : '🔓'}</span>
                <span class="rename-btn" onclick="app.renameLayer('${l.id}', event)">✏️</span>
            </li>`;
            
            if (l.type === 'folder' && l.isOpen) {
                html += this.renderTree(l.layers, depth + 1);
            }
        });
        return html;
    },

    refreshLayerList() {
        document.getElementById('layer-list').innerHTML = this.renderTree(this.layers, 0);

        let selInfo = this.selectedIds.length === 1 ? this.findLayer(this.selectedIds[0]) : null;
        let sel = selInfo ? selInfo.layer : null;

        document.getElementById('btn-lock').disabled = this.selectedIds.length === 0;
        document.getElementById('btn-delete').disabled = this.selectedIds.length === 0;
        document.getElementById('btn-merge').disabled = this.selectedIds.length < 2;
        if(sel) document.getElementById('btn-lock').innerText = sel.locked ? "🔓 Déverrouiller" : "🔒 Verrouiller";

        const fsImg = document.getElementById('fs-image');
        if (sel && sel.type === 'image' && !sel.effectiveLocked) {
            fsImg.disabled = false;
            document.getElementById('img-opacity').value = sel.opacity * 100;
            document.getElementById('img-scale').value = sel.scale * 100;
            document.getElementById('img-rot').value = sel.rot;
            document.getElementById('val-rot').innerText = sel.rot + "°";
        } else {
            fsImg.disabled = true;
        }
        this.draw();
    },

    selectLayer(id) {
        id = Number(id);
        let multi = document.getElementById('multi-select-mode').checked;
        if (multi) {
            if (this.selectedIds.includes(id)) this.selectedIds = this.selectedIds.filter(x => x !== id);
            else this.selectedIds.push(id);
        } else {
            this.selectedIds = [id];
        }
        this.refreshLayerList();
    },
    
    toggleVis(id) { let l = this.findLayer(id).layer; if(l) { l.visible = !l.visible; this.refreshLayerList(); } },
    toggleLock() { 
        this.selectedIds.forEach(id => {
            let l = this.findLayer(id).layer; if(l) l.locked = !l.locked;
        });
        this.refreshLayerList(); 
    },
    
    deleteSelected() {
        if(this.selectedIds.length === 0) return;
        this.saveState(); 
        
        let toDelete = [...this.selectedIds];
        const removeRecursive = (arr) => {
            for(let i=0; i<arr.length; i++) {
                if (toDelete.includes(arr[i].id)) {
                    arr.splice(i, 1); i--;
                } else if (arr[i].type === 'folder') {
                    removeRecursive(arr[i].layers);
                }
            }
        };
        removeRecursive(this.layers);
        this.selectedIds = []; 
        this.refreshLayerList();
    },

    renameLayer(id, e) {
        e.stopPropagation();
        let l = this.findLayer(id).layer;
        if(l) {
            let baseName = l.name.replace(' 🔓','').replace(' 🔒','');
            let n = prompt("Nouveau nom :", baseName);
            if (n) { l.name = n; this.saveState(); this.refreshLayerList(); }
        }
    },

    toggleFolder(id, e) {
        e.stopPropagation();
        let l = this.findLayer(id).layer;
        if(l && l.type === 'folder') { l.isOpen = !l.isOpen; this.refreshLayerList(); }
    },

    moveLayer(dir) {
        if(this.selectedIds.length !== 1) { alert("Veuillez sélectionner exactement 1 calque pour le déplacer."); return; }
        this.saveState();
        let info = this.findLayer(this.selectedIds[0]);
        let arr = info.parentArr;
        let idx = info.idx;
        
        if (dir === -1 && idx > 0) {
            let t = arr[idx]; arr[idx] = arr[idx-1]; arr[idx-1] = t;
        } else if (dir === 1 && idx < arr.length - 1) {
            let t = arr[idx]; arr[idx] = arr[idx+1]; arr[idx+1] = t;
        }
        this.refreshLayerList();
    },

    groupSelected() {
        if(this.selectedIds.length === 0) return;
        this.saveState();
        
        let newFolder = { id: Date.now()+Math.random(), type: 'folder', name: '📁 Dossier ' + this.folderCount++, visible: true, locked: false, isOpen: true, layers: [] };
        let extracted = [];
        let firstParent = null; let firstIdx = -1;

        const extract = (arr) => {
            for(let i=0; i<arr.length; i++) {
                if (this.selectedIds.includes(arr[i].id)) {
                    if(!firstParent) { firstParent = arr; firstIdx = i; }
                    extracted.push(arr.splice(i, 1)[0]);
                    i--;
                } else if (arr[i].type === 'folder') {
                    extract(arr[i].layers);
                }
            }
        };
        extract(this.layers);
        
        newFolder.layers = extracted;
        if(firstParent) firstParent.splice(firstIdx, 0, newFolder);
        else this.layers.unshift(newFolder);
        
        this.selectedIds = [newFolder.id];
        document.getElementById('multi-select-mode').checked = false;
        this.refreshLayerList();
    },

    ungroupSelected() {
        if(this.selectedIds.length !== 1) return;
        let info = this.findLayer(this.selectedIds[0]);
        if(info && info.layer.type === 'folder') {
            this.saveState();
            let children = info.layer.layers;
            info.parentArr.splice(info.idx, 1, ...children);
            this.selectedIds = [];
            this.refreshLayerList();
        } else if (info && info.parentArr !== this.layers) {
            this.saveState();
            let l = info.parentArr.splice(info.idx, 1)[0];
            this.layers.unshift(l); 
            this.refreshLayerList();
        }
    },

    mergeSelected() {
        let toMerge = [];
        const extractAndRemove = (arr) => {
            for(let i = arr.length - 1; i >= 0; i--) {
                if (arr[i].type === 'folder') {
                    extractAndRemove(arr[i].layers);
                } else if (this.selectedIds.includes(arr[i].id) && (arr[i].type === 'path' || arr[i].type === 'pen')) {
                    toMerge.push(arr.splice(i, 1)[0]);
                }
            }
        };

        this.saveState();
        extractAndRemove(this.layers);
        
        if (toMerge.length < 2) {
            this.undoStack.pop(); 
            return alert("Veuillez sélectionner au moins 2 tracés (Crayon) pour fusionner.");
        }

        let mergedPoints = [];
        toMerge.forEach(l => mergedPoints.push(...l.points));
        
        let baseLayer = toMerge[0];
        let name = `🔗 Fusion ${this.layerCount++}`;
        let newL = { id: Date.now()+Math.random(), type: 'path', name: name, visible: true, locked: false, color: baseLayer.color, width: baseLayer.width, points: mergedPoints };
        
        this.layers.unshift(newL);
        this.selectedIds = [newL.id];
        document.getElementById('multi-select-mode').checked = false;
        this.refreshLayerList();
    },

    // --- SAUVEGARDE ET EXPORT ---
    saveState() {
        const cleanLayers = (arr) => arr.map(l => {
            let cl = {...l, img:null};
            if(cl.type === 'folder') cl.layers = cleanLayers(cl.layers);
            return cl;
        });
        this.undoStack.push(JSON.stringify(cleanLayers(this.layers)));
        this.redoStack = [];
        document.getElementById('btn-undo').disabled = false;
        document.getElementById('btn-redo').disabled = true;
    },
    undo() {
        if (this.undoStack.length > 0) {
            const cleanLayers = (arr) => arr.map(l => { let cl={...l, img:null}; if(cl.type==='folder') cl.layers=cleanLayers(cl.layers); return cl; });
            this.redoStack.push(JSON.stringify(cleanLayers(this.layers)));
            this.restoreLayers(this.undoStack.pop());
            document.getElementById('btn-undo').disabled = this.undoStack.length === 0;
            document.getElementById('btn-redo').disabled = false;
        }
    },
    redo() {
        if (this.redoStack.length > 0) {
            const cleanLayers = (arr) => arr.map(l => { let cl={...l, img:null}; if(cl.type==='folder') cl.layers=cleanLayers(cl.layers); return cl; });
            this.undoStack.push(JSON.stringify(cleanLayers(this.layers)));
            this.restoreLayers(this.redoStack.pop());
            document.getElementById('btn-undo').disabled = false;
            document.getElementById('btn-redo').disabled = this.redoStack.length === 0;
        }
    },
    restoreLayers(jsonStr) {
        let parsed = JSON.parse(jsonStr);
        const rebuildImgs = (arr) => {
            arr.forEach(l => {
                if (l.type === 'image') {
                    const img = new Image();
                    img.onload = () => { l.img = img; this.draw(); };
                    img.src = l.src;
                } else if (l.type === 'folder') {
                    rebuildImgs(l.layers);
                }
            });
        };
        rebuildImgs(parsed);
        this.layers = parsed;
        this.selectedIds = [];
        this.refreshLayerList();
    },

    saveProject(isSaveAs = false) {
        if (isSaveAs || !this.currentFileName) {
            let defaultName = this.currentFileName ? this.currentFileName.replace('.sunae', '') : "mon_projet";
            let filename = prompt("Nom du fichier à sauvegarder :", defaultName);
            if (!filename) return; 
            if (!filename.toLowerCase().endsWith('.sunae')) filename += '.sunae';
            this.currentFileName = filename;
        }

        const cleanLayers = (arr) => arr.map(l => {
            let cl = {...l, img:null};
            if(cl.type === 'folder') cl.layers = cleanLayers(cl.layers);
            return cl;
        });

        const proj = {
            settings: { 
                zoom: this.ui.zoom*100, showPoints: document.getElementById('chk-sim-points').checked,
                tool: this.ui.tool, width: this.ui.penWidth*10, tremor: this.ui.tremor, rope: this.ui.ropeLength*2, color: this.ui.color 
            },
            layers: cleanLayers(this.layers)
        };
        
        const blob = new Blob([JSON.stringify(proj)], {type: "application/json"});
        if (navigator.canShare && navigator.userAgent.match(/iPad|iPhone|iPod|Mac/i)) {
            const file = new File([blob], this.currentFileName, {type: "application/json"});
            if (navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: this.currentFileName }).catch(e=>{});
                return;
            }
        }

        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); 
        a.download = this.currentFileName; a.click();
    },

    loadProject(e) {
        const file = e.target.files[0];
        if (!file) return;
        this.currentFileName = file.name;
        const reader = new FileReader();
        reader.onload = (evt) => {
            const proj = JSON.parse(evt.target.result);
            if(proj.settings) {
                document.getElementById('zoom-workspace').value = proj.settings.zoom; this.updateZoomFromSlider();
                if (proj.settings.showPoints !== undefined) document.getElementById('chk-sim-points').checked = proj.settings.showPoints;
                document.getElementById('slider-width').value = proj.settings.width;
                document.getElementById('slider-tremor').value = proj.settings.tremor;
                document.getElementById('slider-rope').value = proj.settings.rope;
                this.updateSliders();
                document.getElementById('color-picker').value = proj.settings.color; this.changeColor();
            }
            this.undoStack = []; this.redoStack = [];
            this.restoreLayers(JSON.stringify(proj.layers));
        };
        reader.readAsText(file);
        e.target.value = '';
    },

    exportTHR() {
        let thrLines = [];
        let currentTheta = 0.0;
        let flatLayers = this.getFlatLayers();
        
        for (let i = flatLayers.length - 1; i >= 0; i--) {
            let l = flatLayers[i];
            if (l.effectiveVisible && (l.type === 'path' || l.type === 'pen')) {
                l.points.forEach(pt => {
                    let rho = Math.hypot(pt.x, pt.y) / this.TABLE_RADIUS;
                    rho = Math.max(0.0, Math.min(1.0, rho));
                    let theta = Math.atan2(pt.y, pt.x) + (Math.PI / 2);
                    while (theta - currentTheta > Math.PI) theta -= 2 * Math.PI;
                    while (theta - currentTheta < -Math.PI) theta += 2 * Math.PI;
                    currentTheta = theta;
                    thrLines.push(`${theta.toFixed(5)} ${rho.toFixed(5)}`);
                });
            }
        }
        if (thrLines.length === 0) return alert("Aucun tracé à exporter !");
        
        let filename = prompt("Nom du fichier à exporter :", "export_table");
        if (!filename) return; 
        if (!filename.toLowerCase().endsWith('.thr')) filename += '.thr';

        const blob = new Blob([thrLines.join('\n')], { type: "text/plain" });
        if (navigator.canShare && navigator.userAgent.match(/iPad|iPhone|iPod|Mac/i)) {
            const file = new File([blob], filename, {type: "text/plain"});
            if (navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: filename }).catch(e=>{});
                return;
            }
        }

        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); 
        a.download = filename; a.click();
    }
};

window.onload = () => app.init();
</script>
</body>
</html>
